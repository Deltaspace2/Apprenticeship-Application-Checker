name: apprenticeship-checker

on:
  schedule:
    # 00:20 UTC daily (8:20am PHT)
    # GitHub sometimes delays scheduled runs by a few minutes - fine for a daily check.
    - cron: "20 0 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed so it can save state.json back to the repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: Save state
        run: |
          git config user.name "checker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || echo "no changes to commit"
          git push
